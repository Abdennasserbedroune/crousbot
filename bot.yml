name: crous-bot
on:
  schedule:
    - cron: "*/30 * * * *"   # relance si arrêté
  workflow_dispatch:          # bouton "Run workflow"
concurrency:
  group: crous-bot
  cancel-in-progress: false   # un seul tourne, un seul en attente
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: state
          key: crous-state-${{ github.run_id }}
          restore-keys: crous-state-
      - run: python crous_bot.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CROUS_POLL_INTERVAL: "30"
          MAX_RUNTIME: "20400"   # 5h40
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state
          key: crous-state-${{ github.run_id }}
